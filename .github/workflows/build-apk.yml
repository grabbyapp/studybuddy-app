          package com.grabbyapp.studybuddy;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;

          import org.json.JSONArray;

          /** Keeps the surprise study alarms scheduled with Android, so they ring when the app is closed. */
          public class AlarmScheduler {
              static final String PREFS = "alarms";

              static void save(Context c, String json) {
                  c.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().putString("times", json == null ? "[]" : json).apply();
              }

              static synchronized void scheduleAll(Context c) {
                  AlarmManager am = c.getSystemService(AlarmManager.class);
                  if (am == null) return;
                  SharedPreferences sp = c.getSharedPreferences(PREFS, Context.MODE_PRIVATE);

                  int old = sp.getInt("count", 0);
                  for (int i = 0; i < old; i++) am.cancel(pending(c, i, 0));

                  JSONArray arr;
                  try { arr = new JSONArray(sp.getString("times", "[]")); } catch (Exception e) { arr = new JSONArray(); }

                  long now = System.currentTimeMillis();
                  int n = 0;
                  for (int i = 0; i < arr.length() && n < 40; i++) {
                      long t = arr.optLong(i, 0);
                      if (t <= now) continue;
                      PendingIntent pi = pending(c, n, t);
                      try {
                          if (Build.VERSION.SDK_INT >= 31 && !am.canScheduleExactAlarms()) {
                              am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, t, pi);
                          } else {
                              // a real alarm clock: exact, works in Doze, shows the alarm icon
                              Intent show = new Intent(c, MainActivity.class).putExtra("route", "settings");
                              PendingIntent showPi = PendingIntent.getActivity(c, 6000 + n, show, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                              am.setAlarmClock(new AlarmManager.AlarmClockInfo(t, showPi), pi);
                          }
                      } catch (SecurityException e) {
                          am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, t, pi);
                      }
                      n++;
                  }
                  sp.edit().putInt("count", n).apply();
              }

              static PendingIntent pending(Context c, int slot, long time) {
                  Intent it = new Intent(c, AlarmReceiver.class).putExtra("time", time);
                  return PendingIntent.getBroadcast(c, 5000 + slot, it,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }
          }
