          package com.grabbyapp.studybuddy;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          /** Puts the study alarms and reminders back after the phone restarts or the app updates. */
          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context c, Intent intent) {
                  String a = intent.getAction();
                  if (Intent.ACTION_BOOT_COMPLETED.equals(a) || Intent.ACTION_MY_PACKAGE_REPLACED.equals(a)) {
                      AlarmScheduler.scheduleAll(c);
                      ReminderScheduler.schedule(c, true);
                      // an alarm that was ringing when the phone turned off rings again
                      if (AlarmStore.sp(c).getBoolean("active", false)) {
                          try { AlarmService.start(c, AlarmStore.sp(c).getLong("cur_time", System.currentTimeMillis()), 0, false); }
                          catch (Exception e) { Notifier.alarmFallback(c); }
                      }
                  }
              }
          }
