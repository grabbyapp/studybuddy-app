          package com.grabbyapp.studybuddy;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;

          import org.json.JSONObject;

          /** Study reminders every few hours (drafts, unfinished work, due cards, goal, streak). */
          public class ReminderScheduler {
              static final String PREFS = "reminders";

              static SharedPreferences sp(Context c) { return c.getSharedPreferences(PREFS, Context.MODE_PRIVATE); }

              static void save(Context c, String items, String settings) {
                  SharedPreferences.Editor e = sp(c).edit().putString("items", items == null ? "[]" : items);
                  try {
                      JSONObject o = new JSONObject(settings);
                      e.putInt("every", Math.max(0, o.optInt("everyHours", 2)))
                              .putString("quietFrom", o.optString("quietFrom", "21:30"))
                              .putString("quietTo", o.optString("quietTo", "07:00"));
                  } catch (Exception ignored) { }
                  e.apply();
                  schedule(c, false);
              }

              static PendingIntent pending(Context c, int flags) {
                  Intent i = new Intent(c, ReminderReceiver.class);
                  return PendingIntent.getBroadcast(c, 9100, i, flags | PendingIntent.FLAG_IMMUTABLE);
              }

              /** force = after a restart. Otherwise only re-arms when the interval changed. */
              static void schedule(Context c, boolean force) {
                  AlarmManager am = c.getSystemService(AlarmManager.class);
                  if (am == null) return;
                  SharedPreferences s = sp(c);
                  int every = s.getInt("every", 2);
                  boolean exists = pending(c, PendingIntent.FLAG_NO_CREATE) != null;
                  if (every <= 0) {
                      if (exists) am.cancel(pending(c, PendingIntent.FLAG_UPDATE_CURRENT));
                      s.edit().putInt("armed", 0).apply();
                      return;
                  }
                  if (!force && exists && s.getInt("armed", 0) == every) return;
                  long interval = every * 3600_000L;
                  am.setInexactRepeating(AlarmManager.RTC_WAKEUP, System.currentTimeMillis() + interval, interval, pending(c, PendingIntent.FLAG_UPDATE_CURRENT));
                  s.edit().putInt("armed", every).apply();
              }

              static boolean quietNow(Context c) {
                  SharedPreferences s = sp(c);
                  int from = toMin(s.getString("quietFrom", "21:30")), to = toMin(s.getString("quietTo", "07:00"));
                  java.util.Calendar cal = java.util.Calendar.getInstance();
                  int m = cal.get(java.util.Calendar.HOUR_OF_DAY) * 60 + cal.get(java.util.Calendar.MINUTE);
                  return from > to ? (m >= from || m < to) : (m >= from && m < to);
              }

              static int toMin(String t) {
                  try { String[] p = t.split(":"); return Integer.parseInt(p[0]) * 60 + Integer.parseInt(p[1]); } catch (Exception e) { return 0; }
              }
          }
