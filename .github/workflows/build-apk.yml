              /** Saves a file the app "downloads" (like My Data export) into the phone's Downloads folder. */
              @JavascriptInterface
              public String saveFile(String name, String mime, String base64) {
                  try {
                      byte[] data = Base64.decode(base64, Base64.DEFAULT);
                      String safe = name == null || name.isEmpty() ? "studybuddy-file" : name.replaceAll("[\\\\/:*?\"<>|]", "_");
                      if (Build.VERSION.SDK_INT >= 29) {
                          ContentValues v = new ContentValues();
                          v.put(MediaStore.Downloads.DISPLAY_NAME, safe);
                          v.put(MediaStore.Downloads.MIME_TYPE, mime == null || mime.isEmpty() ? "application/octet-stream" : mime);
                          v.put(MediaStore.Downloads.IS_PENDING, 1);
                          ContentResolver r = a.getContentResolver();
                          Uri u = r.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                          if (u == null) throw new Exception("no uri");
                          try (OutputStream o = r.openOutputStream(u)) { o.write(data); }
                          v.clear();
                          v.put(MediaStore.Downloads.IS_PENDING, 0);
