name: Build Study Buddy APK

# Builds the real Study Buddy Android app: every app file is packed inside the APK.
# The app files are downloaded from the live site during the build, so no app code is stored here.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-apk.yml

permissions:
  contents: write

env:
  SITE: https://melodic-mousse-4aeab3.netlify.app
  VERSION_NAME: "2.2.0"
  VERSION_CODE: "4"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Write the Android app source
        run: |
          mkdir -p sb/tools sb/app/src/main/java/com/grabbyapp/studybuddy sb/app/src/main/res/{values,drawable,xml} sb/app/src/main/assets/www/vendor/tesseract/lang
          cd sb

          cat > app/src/main/AndroidManifest.xml <<'SB_FILE_0_END'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <queries>
                  <intent><action android:name="android.media.action.IMAGE_CAPTURE" /></intent>
                  <intent>
                      <action android:name="android.intent.action.GET_CONTENT" />
                      <data android:mimeType="*/*" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
                  <intent><action android:name="android.intent.action.SEND" /><data android:mimeType="text/plain" /></intent>
              </queries>

              <application
                  android:label="Study Buddy"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:allowBackup="true"
                  android:supportsRtl="true"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|uiMode|density|fontScale">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="melodic-mousse-4aeab3.netlify.app" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".AlarmActivity"
                      android:exported="false"
                      android:launchMode="singleInstance"
