          import java.io.OutputStream;

          /** Functions the app's JavaScript can call (window.AndroidApp). */
          public class Bridge {
              private final MainActivity a;

              Bridge(MainActivity activity) { a = activity; }

              @JavascriptInterface
              public void showNotification(String title, String body) {
                  String channel = title != null && title.contains("⏰") ? Notifier.CH_ALARM : Notifier.CH_GENERAL;
                  Notifier.show(a, channel, title, body, 2000 + (int) (System.currentTimeMillis() % 1000));
              }

              @JavascriptInterface
              public String notificationPermission() { return a.notifState(); }

              @JavascriptInterface
              public void requestNotificationPermission() { a.runOnUiThread(a::requestNotifPermission); }

              /** JSON list of alarm times (milliseconds). They ring even when the app is closed. */
              @JavascriptInterface
              public void scheduleAlarms(String json) {
                  AlarmScheduler.save(a, json);
                  AlarmScheduler.scheduleAll(a);
              }

              @JavascriptInterface
              public void vibrate(String json) {
                  try {
                      Vibrator v = (Vibrator) a.getSystemService(Context.VIBRATOR_SERVICE);
                      if (v == null || !v.hasVibrator()) return;
                      String s = json == null ? "" : json.trim();
                      if (s.startsWith("[")) {
                          JSONArray arr = new JSONArray(s);
                          if (arr.length() == 0) { v.cancel(); return; }
                          long[] pattern = new long[arr.length() + 1];
                          pattern[0] = 0;
                          for (int i = 0; i < arr.length(); i++) pattern[i + 1] = Math.max(0, arr.optLong(i, 0));
                          if (Build.VERSION.SDK_INT >= 26) v.vibrate(VibrationEffect.createWaveform(pattern, -1));
                          else v.vibrate(pattern, -1);
                      } else {
                          long ms = (long) Double.parseDouble(s.isEmpty() ? "0" : s);
                          if (ms <= 0) { v.cancel(); return; }
                          if (Build.VERSION.SDK_INT >= 26) v.vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE));
                          else v.vibrate(ms);
                      }
                  } catch (Exception ignored) { }
              }

              @JavascriptInterface
              public void share(String title, String text, String url) {
                  String body = ((text == null ? "" : text) + " " + (url == null ? "" : url)).trim();
                  Intent send = new Intent(Intent.ACTION_SEND);
                  send.setType("text/plain");
                  if (title != null && !title.isEmpty()) send.putExtra(Intent.EXTRA_SUBJECT, title);
                  send.putExtra(Intent.EXTRA_TEXT, body);
                  a.runOnUiThread(() -> a.startActivity(Intent.createChooser(send, "Share")));
              }

              @JavascriptInterface
