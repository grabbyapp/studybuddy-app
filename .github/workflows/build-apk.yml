          package com.grabbyapp.studybuddy;

          import android.app.Notification;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ServiceInfo;
          import android.media.AudioAttributes;
          import android.media.AudioManager;
          import android.media.MediaPlayer;
          import android.media.RingtoneManager;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.os.VibrationEffect;
          import android.os.Vibrator;

          /**
           * Rings the surprise study alarm on the phone:
           * - plays the chosen ringtone on the ALARM volume, turned up to MAX (and kept there)
           * - vibrates, wakes the phone, shows the alarm screen over the lock screen
           * - keeps going until the alarm screen reports enough correct answers
           */
          public class AlarmService extends Service {
              static final int NOTIF_ID = 4242;
              static volatile boolean ringing = false;
              static AlarmService instance;

              private MediaPlayer player;
              private Vibrator vibrator;
              private AudioManager audio;
              private int savedVolume = -1;
              private boolean loud = true;
              private PowerManager.WakeLock wakeLock;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private int tick = 0;

              /** Start (or keep) ringing. Safe to call from the app, the alarm receiver or the alarm screen. */
              static void start(Context c, long time, int need, boolean test) {
                  Intent i = new Intent(c, AlarmService.class).putExtra("time", time).putExtra("need", need).putExtra("test", test);
                  if (Build.VERSION.SDK_INT >= 26) c.startForegroundService(i); else c.startService(i);
              }

              /** Called when the student answered enough questions. */
              static void stopNow() {
                  AlarmService s = instance;
                  if (s != null) { s.stopRinging(); s.stopSelf(); }
                  ringing = false;
              }

              @Override public void onCreate() { super.onCreate(); instance = this; }

              @Override public IBinder onBind(Intent intent) { return null; }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  SharedPreferences sp = AlarmStore.sp(this);
                  boolean resumed = intent == null; // Android restarted us: keep ringing the same alarm
                  if (resumed && !sp.getBoolean("active", false)) { stopSelf(); return START_NOT_STICKY; }
                  if (!resumed && !ringing) {
                      int need = intent.getIntExtra("need", 0);
                      sp.edit()
                              .putLong("cur_time", intent.getLongExtra("time", System.currentTimeMillis()))
                              .putBoolean("cur_test", intent.getBooleanExtra("test", false))
                              .putInt("cur_need", need > 0 ? need : sp.getInt("need", 3))
                              .putLong("cur_fired", System.currentTimeMillis())
                              .putBoolean("active", true)
                              .apply();
                  }
                  Notification n = buildNotification();
                  try {
                      if (Build.VERSION.SDK_INT >= 29) startForeground(NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                      else startForeground(NOTIF_ID, n);
                  } catch (Exception e) {
                      Notifier.post(this, NOTIF_ID, n); // still show the full-screen alarm
                  }
                  if (!ringing) { ringing = true; startRinging(); }
                  openScreen();
                  return START_STICKY;
              }

              private PendingIntent screenIntent() {
                  Intent i = new Intent(this, AlarmActivity.class).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_NO_USER_ACTION);
                  return PendingIntent.getActivity(this, 77, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              private Notification buildNotification() {
                  Notifier.createChannels(this);
                  int need = AlarmStore.sp(this).getInt("cur_need", 3);
                  PendingIntent pi = screenIntent();
                  Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, Notifier.CH_RING) : new Notification.Builder(this);
                  b.setSmallIcon(R.drawable.ic_stat)
                          .setColor(0xFF2563EB)
                          .setContentTitle("⏰ Grabby: Surprise study time!")
                          .setContentText("Answer " + need + " question" + (need > 1 ? "s" : "") + " correctly to stop the alarm.")
                          .setCategory(Notification.CATEGORY_ALARM)
                          .setOngoing(true)
                          .setAutoCancel(false)
                          .setVisibility(Notification.VISIBILITY_PUBLIC)
                          .setContentIntent(pi)
                          .setFullScreenIntent(pi, true);
                  if (Build.VERSION.SDK_INT < 26) b.setPriority(Notification.PRIORITY_MAX);
                  Notification n = b.build();
                  n.flags |= Notification.FLAG_NO_CLEAR | Notification.FLAG_INSISTENT;
                  return n;
              }

              private void openScreen() {
                  try {
                      startActivity(new Intent(this, AlarmActivity.class).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_NO_USER_ACTION));
                  } catch (Exception ignored) { /* the full-screen notification opens it */ }
              }

              private void startRinging() {
                  SharedPreferences sp = AlarmStore.sp(this);
                  loud = sp.getBoolean("loud", true);
                  audio = (AudioManager) getSystemService(AUDIO_SERVICE);
                  if (loud && audio != null) {
                      savedVolume = audio.getStreamVolume(AudioManager.STREAM_ALARM);
                      maxVolume();
                  }
                  AudioAttributes attrs = new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_ALARM)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                          .build();
                  try {
                      player = new MediaPlayer();
                      player.setAudioAttributes(attrs);
                      player.setDataSource(this, AlarmStore.soundUri(this, sp.getString("sound", "siren")));
                      player.setLooping(true);
                      player.prepare();
                      player.start();
                  } catch (Exception e) {
                      try { // the chosen phone sound is gone: use the built-in siren, then the phone's alarm
                          if (player != null) player.release();
                          player = new MediaPlayer();
                          player.setAudioAttributes(attrs);
                          player.setDataSource(this, AlarmStore.soundUri(this, "siren"));
                          player.setLooping(true);
                          player.prepare();
                          player.start();
                      } catch (Exception e2) {
                          try {
                              player = MediaPlayer.create(this, RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM));
                              if (player != null) { player.setLooping(true); player.start(); }
                          } catch (Exception ignored) { }
                      }
                  }
                  vibrator = (Vibrator) getSystemService(VIBRATOR_SERVICE);
                  if (vibrator != null && vibrator.hasVibrator()) {
                      long[] pattern = {0, 900, 400, 900, 400};
                      if (Build.VERSION.SDK_INT >= 26) vibrator.vibrate(VibrationEffect.createWaveform(pattern, 0));
                      else vibrator.vibrate(pattern, 0);
                  }
                  PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                  if (pm != null) {
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "studybuddy:alarm");
                      wakeLock.acquire(60 * 60 * 1000L);
                  }
                  handler.post(watchdog);
              }

              private void maxVolume() {
                  try {
                      int max = audio.getStreamMaxVolume(AudioManager.STREAM_ALARM);
                      if (audio.getStreamVolume(AudioManager.STREAM_ALARM) < max) audio.setStreamVolume(AudioManager.STREAM_ALARM, max, 0);
                  } catch (Exception ignored) { }
              }

              /** Every 1.5 s: volume back to MAX; every ~20 s: bring the alarm screen back if it was left. */
              private final Runnable watchdog = new Runnable() {
                  @Override public void run() {
                      if (!ringing) return;
                      if (loud && audio != null) maxVolume();
                      if (player != null && !player.isPlaying()) { try { player.start(); } catch (Exception ignored) { } }
                      tick++;
                      if (tick % 13 == 0 && !AlarmActivity.visible) {
                          Notifier.post(AlarmService.this, NOTIF_ID, buildNotification());
                          openScreen();
                      }
                      handler.postDelayed(this, 1500);
                  }
              };

              void stopRinging() { release(true); }

              /** finished = answered correctly. Otherwise (Android stopped us) the alarm stays active and restarts. */
              private void release(boolean finished) {
                  ringing = false;
                  handler.removeCallbacksAndMessages(null);
                  try { if (player != null) { player.stop(); player.release(); } } catch (Exception ignored) { }
                  player = null;
                  try { if (vibrator != null) vibrator.cancel(); } catch (Exception ignored) { }
                  try { if (audio != null && savedVolume >= 0) audio.setStreamVolume(AudioManager.STREAM_ALARM, savedVolume, 0); } catch (Exception ignored) { }
                  savedVolume = -1;
                  try { if (wakeLock != null && wakeLock.isHeld()) wakeLock.release(); } catch (Exception ignored) { }
                  if (finished) {
                      AlarmStore.sp(this).edit().putBoolean("active", false).apply();
                      stopForeground(STOP_FOREGROUND_REMOVE);
                      Notifier.cancel(this, NOTIF_ID);
                  }
              }

              @Override
              public void onDestroy() {
                  if (ringing) release(false);
                  instance = null;
                  super.onDestroy();
              }
          }
