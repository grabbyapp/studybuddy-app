                  boolean images = false, anyType = false;
                  ArrayList<String> mimes = new ArrayList<>();
                  for (String a : params.getAcceptTypes()) {
                      if (a == null) continue;
                      for (String t : a.split(",")) {
                          t = t.trim().toLowerCase();
                          if (t.isEmpty()) continue;
                          if (t.startsWith(".")) {
                              String m = MimeTypeMap.getSingleton().getMimeTypeFromExtension(t.substring(1));
                              if (m != null) mimes.add(m); else anyType = true;
                              if (m != null && m.startsWith("image/")) images = true;
                          } else {
                              mimes.add(t);
                              if (t.startsWith("image")) images = true;
                          }
                      }
                  }

