name: Build Study Buddy APK

# Builds an Android app (Trusted Web Activity) that opens the live Study Buddy site
# in full screen, then publishes StudyBuddy.apk as a GitHub Release.
# No app source code is stored here: the APK loads https://melodic-mousse-4aeab3.netlify.app

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-apk.yml

permissions:
  contents: write

env:
  SITE_HOST: melodic-mousse-4aeab3.netlify.app
  PACKAGE_ID: com.grabbyapp.studybuddy
  VERSION_NAME: "1.0.0"
  VERSION_CODE: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create the Android project
        run: |
          mkdir -p twa/app/src/main/res/{values,xml,drawable}
          cd twa

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "StudyBuddy"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle <<EOF
          plugins { id 'com.android.application' }
          android {
            namespace '${PACKAGE_ID}'
            compileSdk 34
            defaultConfig {
              applicationId '${PACKAGE_ID}'
              minSdk 21
              targetSdk 34
              versionCode ${VERSION_CODE}
              versionName '${VERSION_NAME}'
            }
            signingConfigs {
              release {
                storeFile file(System.getenv('KS_PATH'))
                storePassword System.getenv('KS_PASS')
                keyAlias 'studybuddy'
                keyPassword System.getenv('KS_PASS')
              }
            }
            buildTypes {
              release { minifyEnabled false; signingConfig signingConfigs.release }
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            lint { checkReleaseBuilds false; abortOnError false }
          }
          dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0' }
          EOF

          cat > app/src/main/AndroidManifest.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <uses-permission android:name="android.permission.VIBRATE" />
            <queries>
              <intent><action android:name="android.support.customtabs.action.CustomTabsService" /></intent>
            </queries>
            <application
                android:label="@string/app_name"
                android:icon="@mipmap/ic_launcher"
                android:roundIcon="@mipmap/ic_launcher"
                android:allowBackup="true"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.Translucent.NoTitleBar">
              <meta-data android:name="asset_statements" android:resource="@string/asset_statements" />
              <activity
                  android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"
                  android:exported="true"
                  android:label="@string/app_name">
                <meta-data android:name="android.support.customtabs.trusted.DEFAULT_URL" android:value="https://${SITE_HOST}/" />
                <meta-data android:name="android.support.customtabs.trusted.STATUS_BAR_COLOR" android:resource="@color/primary" />
                <meta-data android:name="android.support.customtabs.trusted.NAVIGATION_BAR_COLOR" android:resource="@color/background" />
                <meta-data android:name="android.support.customtabs.trusted.SPLASH_IMAGE_DRAWABLE" android:resource="@drawable/splash" />
                <meta-data android:name="android.support.customtabs.trusted.SPLASH_SCREEN_BACKGROUND_COLOR" android:resource="@color/background" />
                <meta-data android:name="android.support.customtabs.trusted.SPLASH_SCREEN_FADE_OUT_DURATION" android:value="300" />
                <meta-data android:name="android.support.customtabs.trusted.FILE_PROVIDER_AUTHORITY" android:value="${PACKAGE_ID}.fileprovider" />
                <meta-data android:name="android.support.customtabs.trusted.DISPLAY_MODE" android:value="default" />
                <meta-data android:name="android.support.customtabs.trusted.SCREEN_ORIENTATION" android:value="portrait" />
                <meta-data android:name="android.support.customtabs.trusted.FALLBACK_STRATEGY" android:value="webview" />
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
                <intent-filter android:autoVerify="true">
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="https" android:host="${SITE_HOST}" />
                </intent-filter>
              </activity>
              <activity android:name="com.google.androidbrowserhelper.trusted.FocusActivity" />
              <activity
                  android:name="com.google.androidbrowserhelper.trusted.WebViewFallbackActivity"
                  android:configChanges="orientation|screenSize" />
              <activity
                  android:name="com.google.androidbrowserhelper.trusted.NotificationPermissionRequestActivity" />
              <provider
                  android:name="androidx.core.content.FileProvider"
                  android:authorities="${PACKAGE_ID}.fileprovider"
                  android:grantUriPermissions="true"
                  android:exported="false">
                <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/filepaths" />
              </provider>
              <service
                  android:name="com.google.androidbrowserhelper.trusted.DelegationService"
                  android:enabled="true"
                  android:exported="true">
                <meta-data android:name="android.support.customtabs.trusted.SMALL_ICON" android:resource="@drawable/splash" />
                <intent-filter>
                  <action android:name="android.support.customtabs.trusted.TRUSTED_WEB_ACTIVITY_SERVICE" />
                  <category android:name="android.intent.category.DEFAULT" />
                </intent-filter>
              </service>
            </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <string name="app_name">Study Buddy</string>
            <string name="asset_statements">[{\"relation\": [\"delegate_permission/common.handle_all_urls\"], \"target\": {\"namespace\": \"web\", \"site\": \"https://${SITE_HOST}\"}}]</string>
          </resources>
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <color name="primary">#2563EB</color>
            <color name="background">#EFF6FF</color>
          </resources>
          EOF

          cat > app/src/main/res/xml/filepaths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths><files-path name="twa_splash" path="twa_splash/" /></paths>
          EOF

      - name: Make the app icons from the live site's logo
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          curl -fsSL "https://${SITE_HOST}/icon.svg" -o icon.svg
          res=twa/app/src/main/res
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            name=${d%%:*}; size=${d##*:}
            mkdir -p $res/mipmap-$name
            rsvg-convert -w $size -h $size icon.svg -o $res/mipmap-$name/ic_launcher.png
          done
          rsvg-convert -w 288 -h 288 icon.svg -o $res/drawable/splash.png
          rsvg-convert -w 512 -h 512 icon.svg -o icon-512.png

      - name: Create a signing key
        run: |
          KS_PASS=$(openssl rand -hex 16)
          echo "::add-mask::$KS_PASS"
          echo "KS_PASS=$KS_PASS" >> $GITHUB_ENV
          echo "KS_PATH=$PWD/release.keystore" >> $GITHUB_ENV
          keytool -genkeypair -keystore release.keystore -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -alias studybuddy -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Study Buddy, OU=grabbyapp, O=grabbyapp, C=PH"
          FP=$(keytool -list -v -keystore release.keystore -storepass "$KS_PASS" -alias studybuddy | grep 'SHA256:' | head -1 | sed 's/.*SHA256: *//')
          echo "SHA256 fingerprint: $FP"
          cat > assetlinks.json <<EOF
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "${PACKAGE_ID}",
              "sha256_cert_fingerprints": ["${FP}"]
            }
          }]
          EOF
          cat assetlinks.json

      - name: Build the APK
        run: |
          cd twa
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../StudyBuddy.apk
          cd .. && ls -l StudyBuddy.apk

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Study Buddy ${{ env.VERSION_NAME }}
          make_latest: "true"
          body: |
            Study Buddy for Android. Download **StudyBuddy.apk** below and open it on your phone.
            The app always shows the newest version of Study Buddy, so you only install it once.
          files: |
            StudyBuddy.apk
            assetlinks.json
