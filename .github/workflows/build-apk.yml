                      r.put("time", s.getLong("cur_time", 0));
                      r.put("firedAt", s.getLong("cur_fired", System.currentTimeMillis()));
                      r.put("doneAt", System.currentTimeMillis());
                      r.put("correct", correct);
                      r.put("total", total);
                      r.put("need", s.getInt("cur_need", 3));
                      r.put("test", s.getBoolean("cur_test", false));
                      arr.put(r);
                      s.edit().putString("results", arr.toString()).putBoolean("active", false).apply();
                  } catch (Exception ignored) { }
