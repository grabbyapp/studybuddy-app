          package com.grabbyapp.studybuddy;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.util.ArrayList;
          import java.util.Collections;

          /** Shows one study reminder. The most important messages come first, and they take turns. */
          public class ReminderReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context c, Intent intent) {
                  if (MainActivity.visible || AlarmService.ringing || ReminderScheduler.quietNow(c)) return;
                  SharedPreferences s = ReminderScheduler.sp(c);
                  ArrayList<JSONObject> items = new ArrayList<>();
                  long now = System.currentTimeMillis();
                  try {
                      JSONArray arr = new JSONArray(s.getString("items", "[]"));
                      for (int i = 0; i < arr.length(); i++) {
                          JSONObject o = arr.getJSONObject(i);
                          long until = o.optLong("until", 0);
                          if (until == 0 || until > now) items.add(o);
                      }
                  } catch (Exception ignored) { }
                  if (items.isEmpty()) {
                      Notifier.show(c, Notifier.CH_REMIND, "💙 Grabby misses you!", "A quick 5-minute review keeps the forgetting away.", 9200, "study");
                      return;
                  }
                  Collections.sort(items, (a, b) -> b.optInt("p", 0) - a.optInt("p", 0));
                  int idx = s.getInt("idx", 0);
                  JSONObject pick = items.get(idx % Math.min(3, items.size()));
                  s.edit().putInt("idx", idx + 1).apply();
                  Notifier.show(c, Notifier.CH_REMIND, pick.optString("title", "Study time!"), pick.optString("body", ""), 9200, pick.optString("route", "home"));
              }
          }
