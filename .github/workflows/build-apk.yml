                  } catch (Exception e) { return "0"; }
              }

              /** true when version a is newer than version b ("2.10.0" > "2.9.3"). */
              static boolean newer(String a, String b) {
                  String[] x = a.replaceAll("[^0-9.]", "").split("\\.");
                  String[] y = b.replaceAll("[^0-9.]", "").split("\\.");
                  for (int i = 0; i < Math.max(x.length, y.length); i++) {
                      int p = i < x.length && !x[i].isEmpty() ? Integer.parseInt(x[i]) : 0;
                      int q = i < y.length && !y[i].isEmpty() ? Integer.parseInt(y[i]) : 0;
                      if (p != q) return p > q;
                  }
                  return false;
              }

              /** manual = the user tapped "Check for updates" (always answers, ignores "later"). */
              public static void check(Activity a, boolean manual) {
                  if (busy) return;
                  SharedPreferences sp = prefs(a);
                  long now = System.currentTimeMillis();
                  if (!manual && now - sp.getLong("lastCheck", 0) < AUTO_EVERY_MS) return;
                  sp.edit().putLong("lastCheck", now).apply();
                  busy = true;
                  Handler ui = new Handler(Looper.getMainLooper());
                  new Thread(() -> {
                      try {
                          HttpURLConnection c = (HttpURLConnection) new URL(LATEST).openConnection();
                          c.setConnectTimeout(10000); c.setReadTimeout(15000);
                          c.setRequestProperty("Accept", "application/vnd.github+json");
                          c.setRequestProperty("User-Agent", "StudyBuddy-Android");
                          if (c.getResponseCode() != 200) throw new Exception("HTTP " + c.getResponseCode());
                          StringBuilder sb = new StringBuilder();
                          try (BufferedReader r = new BufferedReader(new InputStreamReader(c.getInputStream(), "UTF-8"))) {
                              String line; while ((line = r.readLine()) != null) sb.append(line);
                          }
                          JSONObject rel = new JSONObject(sb.toString());
                          String latest = rel.optString("tag_name", "").replaceFirst("^v", "");
                          String url = null; long size = 0;
                          JSONArray assets = rel.optJSONArray("assets");
                          for (int i = 0; assets != null && i < assets.length(); i++) {
                              JSONObject as = assets.getJSONObject(i);
                              if (as.optString("name").endsWith(".apk")) { url = as.optString("browser_download_url"); size = as.optLong("size"); break; }
                          }
                          String notes = rel.optString("body", "");
                          String cur = currentVersion(a);
                          final String fUrl = url; final long fSize = size;
                          ui.post(() -> {
                              busy = false;
                              if (a.isFinishing()) return;
                              if (fUrl != null && newer(latest, cur)) {
                                  if (!manual && latest.equals(sp.getString("later", ""))
                                          && System.currentTimeMillis() - sp.getLong("laterAt", 0) < 24L * 60 * 60 * 1000) return;
                                  offer(a, latest, cur, fUrl, fSize, notes);
                              } else if (manual) {
                                  Toast.makeText(a, "You have the newest Study Buddy (" + cur + ") 🎉", Toast.LENGTH_LONG).show();
                              }
                          });
                      } catch (Exception e) {
                          ui.post(() -> {
                              busy = false;
                              if (manual) Toast.makeText(a, "Couldn't check for updates. Check your internet.", Toast.LENGTH_LONG).show();
                          });
                      }
                  }).start();
              }

              static void offer(Activity a, String latest, String cur, String url, long size, String notes) {
                  String mb = size > 0 ? String.format(" (%.1f MB)", size / 1048576.0) : "";
                  String msg = "Grabby has a new version for you! 🎓\n\nYou have " + cur + ". New: " + latest + mb + ".\n\n"
                          + "It installs over this one. Your decks, progress and settings stay.";
                  String first = notes.split("\n")[0].trim();
                  if (!first.isEmpty() && first.length() < 240) msg += "\n\n" + first;
                  new AlertDialog.Builder(a)
                          .setTitle("Update available ✨")
                          .setMessage(msg)
                          .setPositiveButton("Update now", (d, w) -> download(a, latest, url, size))
                          .setNegativeButton("Later", (d, w) -> prefs(a).edit()
                                  .putString("later", latest).putLong("laterAt", System.currentTimeMillis()).apply())
                          .show();
              }

              static void download(Activity a, String version, String url, long size) {
                  LinearLayout box = new LinearLayout(a);
                  box.setOrientation(LinearLayout.VERTICAL);
                  int pad = (int) (20 * a.getResources().getDisplayMetrics().density);
                  box.setPadding(pad, pad, pad, pad / 2);
                  TextView label = new TextView(a);
                  label.setText("Downloading Study Buddy " + version + "…");
                  ProgressBar bar = new ProgressBar(a, null, android.R.attr.progressBarStyleHorizontal);
                  bar.setMax(100);
                  box.addView(label); box.addView(bar);
                  AlertDialog dlg = new AlertDialog.Builder(a).setTitle("Updating").setView(box).setCancelable(false).show();
                  Handler ui = new Handler(Looper.getMainLooper());
                  new Thread(() -> {
                      File dir = new File(a.getCacheDir(), "updates");
                      File[] old = dir.listFiles();
                      if (old != null) for (File f : old) f.delete();
                      dir.mkdirs();
                      File out = new File(dir, "StudyBuddy-" + version + ".apk");
                      try {
                          HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                          c.setInstanceFollowRedirects(true);
                          c.setConnectTimeout(15000); c.setReadTimeout(30000);
                          c.setRequestProperty("User-Agent", "StudyBuddy-Android");
                          // GitHub sends release files from another address: follow that hop by hand
                          int code = c.getResponseCode();
                          for (int hops = 0; (code == 301 || code == 302 || code == 303 || code == 307 || code == 308) && hops < 5; hops++) {
                              String next = c.getHeaderField("Location");
                              c.disconnect();
                              c = (HttpURLConnection) new URL(new URL(url), next).openConnection();
                              c.setConnectTimeout(15000); c.setReadTimeout(30000);
                              code = c.getResponseCode();
                          }
                          if (code != 200) throw new Exception("HTTP " + code);
                          long total = c.getContentLengthLong() > 0 ? c.getContentLengthLong() : size;
                          long got = 0; int lastPct = -1;
                          try (InputStream in = c.getInputStream(); FileOutputStream fo = new FileOutputStream(out)) {
                              byte[] buf = new byte[64 * 1024]; int n;
                              while ((n = in.read(buf)) > 0) {
                                  fo.write(buf, 0, n); got += n;
                                  if (total > 0) {
                                      int pct = (int) (got * 100 / total);
                                      if (pct != lastPct) { lastPct = pct; ui.post(() -> bar.setProgress(pct)); }
                                  }
                              }
                          }
                          if (size > 0 && out.length() != size) throw new Exception("incomplete download");
                          ui.post(() -> { dlg.dismiss(); install(a, out); });
                      } catch (Exception e) {
                          out.delete();
                          ui.post(() -> {
                              dlg.dismiss();
                              new AlertDialog.Builder(a).setTitle("Download stopped")
                                      .setMessage("The update couldn't download. Check your internet and try again.")
                                      .setPositiveButton("Try again", (d, w) -> download(a, version, url, size))
                                      .setNegativeButton("Later", null).show();
                          });
                      }
                  }).start();
              }

              static void install(Activity a, File apk) {
                  if (Build.VERSION.SDK_INT >= 26 && !a.getPackageManager().canRequestPackageInstalls()) {
                      pendingApk = apk;
                      new AlertDialog.Builder(a)
                              .setTitle("One-time permission")
                              .setMessage("To install updates, allow Study Buddy to install apps.\n\nOn the next screen turn on \"Allow from this source\", then come back.")
                              .setPositiveButton("Open settings", (d, w) -> {
                                  try {
                                      a.startActivity(new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                                              Uri.parse("package:" + a.getPackageName())));
                                  } catch (Exception e) {
                                      a.startActivity(new Intent(Settings.ACTION_SETTINGS));
                                  }
                              })
                              .setNegativeButton("Later", null).show();
                      return;
                  }
                  pendingApk = null;
                  try {
                      Uri uri = FileProvider.getUriForFile(a, a.getPackageName() + ".files", apk);
                      Intent i = new Intent(Intent.ACTION_VIEW);
                      i.setDataAndType(uri, "application/vnd.android.package-archive");
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                      a.startActivity(i);
                  } catch (Exception e) {
                      Toast.makeText(a, "Couldn't open the installer: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }

              /** Called from onResume: finish an install that was waiting for the permission. */
              public static void resume(Activity a) {
                  if (pendingApk != null && pendingApk.exists()
                          && (Build.VERSION.SDK_INT < 26 || a.getPackageManager().canRequestPackageInstalls())) {
                      install(a, pendingApk);
                  }
              }
          }
          SB_FILE_18_END

          cat > settings.gradle <<'SB_END'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "StudyBuddy"
          include ':app'
          SB_END

          cat > build.gradle <<'SB_END'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          SB_END

          cat > gradle.properties <<'SB_END'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          SB_END

          cat > app/build.gradle <<SB_END
          plugins { id 'com.android.application' }
          android {
            namespace 'com.grabbyapp.studybuddy'
            compileSdk 34
            defaultConfig {
              applicationId 'com.grabbyapp.studybuddy'
              minSdk 24
              targetSdk 34
              versionCode ${VERSION_CODE}
              versionName '${VERSION_NAME}'
            }
            signingConfigs {
              release {
                storeFile file(System.getenv('KS_PATH'))
                storePassword System.getenv('KS_PASS')
                keyAlias 'studybuddy'
                keyPassword System.getenv('KS_PASS')
              }
            }
            buildTypes {
              release { minifyEnabled false; signingConfig signingConfigs.release }
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            lint { checkReleaseBuilds false; abortOnError false }
          }
          dependencies {
            implementation 'androidx.webkit:webkit:1.11.0'
            implementation 'androidx.core:core:1.13.1'
          }
          SB_END

      - name: Pack the Study Buddy app files into the APK
        working-directory: sb
        run: |
          set -e
          W=app/src/main/assets/www
          for f in index.html admin.html app.js admin.js ui.js data.js brain.js config.js alarm.js importer.js schools.js drafts.js tutorial.js alarm.html styles.css manifest.json icon.svg; do
            curl -fsSL --retry 3 "$SITE/$f" -o "$W/$f"
          done
          cp tools/android.js "$W/android.js"

          get() { out="$1"; shift; for u in "$@"; do curl -fsSL --retry 3 "$u" -o "$out" && return 0; done; echo "Could not download $out"; exit 1; }
          V=$W/vendor
          get $V/supabase.js https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js
          get $V/pdf.min.js https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js
          get $V/pdf.worker.min.js https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js
          get $V/jszip.min.js https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js
          get $V/qrcode.js https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js
          get $V/tesseract/tesseract.min.js https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js
          get $V/tesseract/worker.min.js https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/worker.min.js
          for c in tesseract-core-simd-lstm.wasm.js tesseract-core-lstm.wasm.js; do
            get $V/tesseract/$c https://cdn.jsdelivr.net/npm/tesseract.js-core@5/$c https://unpkg.com/tesseract.js-core@5/$c
          done
          get $V/tesseract/lang/eng.traineddata.gz \
            https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng/4.0.0_best_int/eng.traineddata.gz \
            https://tessdata.projectnaptha.com/4.0.0_best/eng.traineddata.gz \
            https://tessdata.projectnaptha.com/4.0.0/eng.traineddata.gz

          python3 - <<'SB_END'
          import re, urllib.request, pathlib
          ua = {"User-Agent": "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36"}
          url = "https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
          css = urllib.request.urlopen(urllib.request.Request(url, headers=ua)).read().decode()
          out = pathlib.Path("app/src/main/assets/www/vendor/fonts"); out.mkdir(parents=True, exist_ok=True)
          for i, u in enumerate(dict.fromkeys(re.findall(r"url\((https://fonts\.gstatic\.com/[^)]+)\)", css))):
              (out / f"f{i}.woff2").write_bytes(urllib.request.urlopen(urllib.request.Request(u, headers=ua)).read())
              css = css.replace(u, f"fonts/f{i}.woff2")
          pathlib.Path("app/src/main/assets/www/vendor/fonts.css").write_text(css)
          print("fonts:", len(list(out.iterdir())))
          SB_END

          python3 tools/patch.py $W
          mkdir -p app/src/main/res/raw && python3 tools/sounds.py app/src/main/res/raw && ls -l app/src/main/res/raw
          grep -q 'window.Supabase\|createClient' $V/supabase.js
          du -sh $W; find $W -type f | sort

      - name: Make the app icons
        working-directory: sb
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          res=app/src/main/res
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            name=${d%%:*}; size=${d##*:}
            mkdir -p $res/mipmap-$name
            rsvg-convert -w $size -h $size app/src/main/assets/www/icon.svg -o $res/mipmap-$name/ic_launcher.png
          done

      - name: Load the permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # Every release must use the same key, or phones refuse to update. No key = no build.
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the KEYSTORE_B64 and KEYSTORE_PASSWORD secrets to the repository first."
            exit 1
          fi
          # ignore spaces / line breaks that sneak in when the secrets are pasted
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > release.keystore
          KS_PASS=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '[:space:]')
          echo "::add-mask::$KS_PASS"
          echo "KS_PASS=$KS_PASS" >> $GITHUB_ENV
          echo "KS_PATH=$PWD/release.keystore" >> $GITHUB_ENV
          keytool -list -v -keystore release.keystore -storepass "$KS_PASS" -alias studybuddy | grep 'SHA256:'

      - name: Build the APK
        working-directory: sb
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../StudyBuddy.apk
          cd .. && ls -l StudyBuddy.apk
          unzip -l StudyBuddy.apk | grep -c 'assets/www/'

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Study Buddy ${{ env.VERSION_NAME }}
          make_latest: "true"
          body: |
            Study Buddy for Android, the full app. Everything is inside the APK and runs on your phone.
            Download **StudyBuddy.apk** below and open it on your phone.
            New in 2.2.0: the app updates itself. When a new version is out, Grabby asks you, downloads it and installs it over the old one. Your decks and progress stay, no uninstalling.
            Last time only: if you have 2.1.0 or older, uninstall it first, then install this one. From now on updates install in place.
            Includes everything from 2.1.0: the phone alarm that rings over the lock screen and only stops after a correct answer, ringtones, study reminders, the Grabby tutorial and the cartoon redesign.
          files: StudyBuddy.apk
