          package com.grabbyapp.studybuddy;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.net.Uri;

          import org.json.JSONArray;
          import org.json.JSONObject;

          /** Everything the alarm needs, saved on the phone: questions, sound, results. */
          public class AlarmStore {
              static final String PREFS = "alarm_store";

              static SharedPreferences sp(Context c) { return c.getSharedPreferences(PREFS, Context.MODE_PRIVATE); }

              static void setCards(Context c, String json) { sp(c).edit().putString("cards", json == null ? "[]" : json).apply(); }

              static void setConfig(Context c, String json) {
                  try {
                      JSONObject o = new JSONObject(json);
                      sp(c).edit()
                              .putInt("need", Math.max(1, o.optInt("need", 3)))
                              .putString("sound", o.optString("sound", "siren"))
                              .putBoolean("loud", o.optBoolean("loud", true))
                              .putString("name", o.optString("name", "there"))
                              .apply();
                  } catch (Exception ignored) { }
              }

              /** Data for the alarm screen (alarm.html). */
              static String screenData(Context c) {
                  SharedPreferences s = sp(c);
                  try {
                      JSONObject o = new JSONObject();
                      o.put("need", s.getInt("cur_need", s.getInt("need", 3)));
                      o.put("test", s.getBoolean("cur_test", false));
                      o.put("time", s.getLong("cur_time", System.currentTimeMillis()));
                      o.put("name", s.getString("name", "there"));
                      o.put("questions", new JSONArray(s.getString("cards", "[]")));
                      return o.toString();
                  } catch (Exception e) { return "{}"; }
              }

              static synchronized void addResult(Context c, int correct, int total) {
                  SharedPreferences s = sp(c);
                  try {
                      JSONArray arr = new JSONArray(s.getString("results", "[]"));
                      JSONObject r = new JSONObject();
                      r.put("time", s.getLong("cur_time", 0));
                      r.put("firedAt", s.getLong("cur_fired", System.currentTimeMillis()));
                      r.put("doneAt", System.currentTimeMillis());
                      r.put("correct", correct);
                      r.put("total", total);
                      r.put("need", s.getInt("cur_need", 3));
                      r.put("test", s.getBoolean("cur_test", false));
                      arr.put(r);
                      s.edit().putString("results", arr.toString()).putBoolean("active", false).apply();
                  } catch (Exception ignored) { }
              }

              static synchronized String takeResults(Context c) {
                  String r = sp(c).getString("results", "[]");
                  sp(c).edit().putString("results", "[]").apply();
                  return r;
              }

              /** The chosen ringtone: one of the built-in sounds, or a phone sound ("uri:..."). */
              static Uri soundUri(Context c, String sound) {
                  if (sound != null && sound.startsWith("uri:")) return Uri.parse(sound.substring(4));
                  String name = sound == null || sound.isEmpty() ? "siren" : sound;
                  int id = c.getResources().getIdentifier(name, "raw", c.getPackageName());
                  if (id == 0) id = c.getResources().getIdentifier("siren", "raw", c.getPackageName());
                  return Uri.parse("android.resource://" + c.getPackageName() + "/" + id);
              }
          }
