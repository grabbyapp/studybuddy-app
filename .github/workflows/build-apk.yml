          package com.grabbyapp.studybuddy;

          import android.Manifest;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.media.AudioAttributes;
          import android.media.RingtoneManager;
          import android.os.Build;

          public class Notifier {
              static final String CH_ALARM = "study_alarm";   // alarm messages from the open app
              static final String CH_RING = "alarm_ring";     // the ringing alarm (sound comes from AlarmService)
              static final String CH_REMIND = "study_reminders";
              static final String CH_GENERAL = "general";

              static void createChannels(Context c) {
                  if (Build.VERSION.SDK_INT < 26) return;
                  NotificationManager nm = c.getSystemService(NotificationManager.class);
                  if (nm == null) return;
                  AudioAttributes alarmAttrs = new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_ALARM)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                          .build();

                  NotificationChannel ring = new NotificationChannel(CH_RING, "Ringing alarm", NotificationManager.IMPORTANCE_HIGH);
                  ring.setDescription("The surprise study alarm screen (it rings until you answer)");
                  ring.setSound(null, null);
                  ring.enableVibration(false);
                  ring.setBypassDnd(true);
                  ring.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                  nm.createNotificationChannel(ring);

                  NotificationChannel alarm = new NotificationChannel(CH_ALARM, "Surprise study alarm", NotificationManager.IMPORTANCE_HIGH);
                  alarm.setDescription("Alarm messages");
                  alarm.enableVibration(true);
                  alarm.setVibrationPattern(new long[]{0, 700, 300, 700});
                  alarm.setSound(RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM), alarmAttrs);
                  nm.createNotificationChannel(alarm);

                  NotificationChannel remind = new NotificationChannel(CH_REMIND, "Study reminders", NotificationManager.IMPORTANCE_HIGH);
                  remind.setDescription("Drafts to finish, unfinished work, due cards and your streak");
                  remind.enableVibration(true);
                  nm.createNotificationChannel(remind);

                  NotificationChannel general = new NotificationChannel(CH_GENERAL, "Other", NotificationManager.IMPORTANCE_DEFAULT);
                  general.setDescription("Focus timer and other messages");
                  nm.createNotificationChannel(general);
              }

              static boolean enabled(Context c) {
                  NotificationManager nm = c.getSystemService(NotificationManager.class);
                  return nm != null && nm.areNotificationsEnabled();
              }

              static boolean allowed(Context c) {
                  return Build.VERSION.SDK_INT < 33 || c.checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) == PackageManager.PERMISSION_GRANTED;
              }

              static void post(Context c, int id, Notification n) {
                  if (!allowed(c)) return;
                  NotificationManager nm = c.getSystemService(NotificationManager.class);
                  if (nm != null) nm.notify(id, n);
              }

              static void cancel(Context c, int id) {
                  NotificationManager nm = c.getSystemService(NotificationManager.class);
                  if (nm != null) nm.cancel(id);
              }

              static PendingIntent openApp(Context c, int code, String route) {
                  Intent open = new Intent(c, MainActivity.class)
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  if (route != null) open.putExtra("route", route);
                  return PendingIntent.getActivity(c, code, open, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              static Notification.Builder builder(Context c, String channel) {
                  createChannels(c);
                  Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(c, channel) : new Notification.Builder(c);
                  return b.setSmallIcon(R.drawable.ic_stat).setColor(0xFF2563EB).setAutoCancel(true);
              }

              static void show(Context c, String channel, String title, String body, int id) {
                  show(c, channel, title, body, id, null);
              }

              static void show(Context c, String channel, String title, String body, int id, String route) {
                  Notification.Builder b = builder(c, channel)
                          .setContentTitle(title == null ? "Study Buddy" : title)
                          .setContentText(body == null ? "" : body)
                          .setStyle(new Notification.BigTextStyle().bigText(body == null ? "" : body))
                          .setContentIntent(openApp(c, id, route));
                  if (Build.VERSION.SDK_INT < 26) b.setPriority(Notification.PRIORITY_HIGH).setDefaults(Notification.DEFAULT_ALL);
                  if (CH_ALARM.equals(channel)) b.setCategory(Notification.CATEGORY_ALARM);
                  if (CH_REMIND.equals(channel)) b.setCategory(Notification.CATEGORY_REMINDER);
                  post(c, id, b.build());
              }

              /** Full-screen alarm notification (used when the ringing service can't start from the background). */
              static void alarmFallback(Context c) {
                  Intent i = new Intent(c, AlarmActivity.class).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  PendingIntent pi = PendingIntent.getActivity(c, 78, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  Notification.Builder b = builder(c, CH_ALARM)
                          .setContentTitle("⏰ Grabby: Surprise study time!")
                          .setContentText("Tap to answer and stop the alarm.")
                          .setCategory(Notification.CATEGORY_ALARM)
                          .setOngoing(true)
                          .setAutoCancel(false)
                          .setFullScreenIntent(pi, true)
                          .setContentIntent(pi);
                  if (Build.VERSION.SDK_INT < 26) b.setPriority(Notification.PRIORITY_MAX).setSound(RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM));
                  Notification n = b.build();
                  n.flags |= Notification.FLAG_INSISTENT;
                  post(c, AlarmService.NOTIF_ID, n);
              }
          }
