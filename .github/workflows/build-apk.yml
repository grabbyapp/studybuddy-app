          cat > tools/patch.py <<'SB_FILE_4_END'
          """Adapts the Study Buddy web files so they run from inside the APK.

          Run from the folder that holds the app files (assets/www). Every change is checked:
          if the app code changed and a patch no longer fits, the build stops with a clear error.
          """
          import pathlib
          import sys

          SITE = "https://melodic-mousse-4aeab3.netlify.app/"
          root = pathlib.Path(sys.argv[1] if len(sys.argv) > 1 else ".")


          def patch(name, old, new, count=1):
              p = root / name
              s = p.read_text(encoding="utf-8")
              n = s.count(old)
              if n != count:
                  sys.exit(f"patch failed: {name}: expected {count} of {old!r}, found {n}")
              p.write_text(s.replace(old, new), encoding="utf-8")
              print(f"patched {name}: {old[:60]!r}")


          # Supabase library comes from the APK instead of the internet
          patch("data.js",
                "await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm')",
                "await window.__loadSupabase()")
          # Email links (confirm account, reset password) open the website version
          patch("data.js", "location.origin + location.pathname", f"'{SITE}'", count=2)

          # Share links point to the public website (they open in the app too if it is installed)
          patch("app.js", "`${location.origin}${location.pathname}#import/${code}`", "`" + SITE + "#import/${code}`")
          patch("app.js", "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js", "vendor/qrcode.js")

          # File readers bundled in the APK
          patch("importer.js", "'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js'", "'vendor/pdf.min.js'")
          patch("importer.js", "'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'",
                "new URL('vendor/pdf.worker.min.js', location.href).href")
          patch("importer.js", "'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js'", "'vendor/jszip.min.js'")
          patch("importer.js", "'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'", "'vendor/tesseract/tesseract.min.js'")
          patch("importer.js", "await T.recognize(img, 'eng', {",
                "await T.recognize(img, 'eng', {\n"
                "    workerPath: new URL('vendor/tesseract/worker.min.js', location.href).href,\n"
                "    corePath: new URL('vendor/tesseract/', location.href).href,\n"
                "    langPath: new URL('vendor/tesseract/lang', location.href).href,\n"
                "    workerBlobURL: false,\n")

          # Pages: bundled font + phone helpers (loaded before the app starts)
          for page, module in (("index.html", '<script type="module" src="app.js"></script>'),
                               ("admin.html", '<script type="module" src="admin.js"></script>')):
              patch(page, "https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap", "vendor/fonts.css")
              patch(page, module, '<script src="android.js"></script>\n  ' + module)
          patch("index.html", '<link rel="preconnect" href="https://fonts.googleapis.com">', "")
          # The phone's alarm screen (shown over the lock screen)
          patch("alarm.html", "https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap", "vendor/fonts.css")

          # Remove what the web host adds to its pages (a comment and a toolbar script that cannot load in the app)
          import re
          for page in ("index.html", "admin.html", "alarm.html"):
              q = root / page
              t = q.read_text(encoding="utf-8")
              t2 = re.sub(r"<!-- This site is hosted on Netlify.*?-->\n?", "", t, flags=re.S)
              t2 = re.sub(r'<script[^>]*/\.netlify/scripts/[^>]*></script>\n?', "", t2)
              q.write_text(t2, encoding="utf-8")
              print(f"cleaned {page}: {len(t) - len(t2)} chars of host extras removed")

          print("all patches applied")
          SB_FILE_4_END

          cat > tools/sounds.py <<'SB_FILE_5_END'
          """Makes the alarm ringtones as WAV files (same recipes as the web app's sounds).

          Usage: python3 sounds.py <output folder>   (e.g. app/src/main/res/raw)
          """
          import array
          import math
          import pathlib
          import sys
          import wave

          RATE = 22050
          out = pathlib.Path(sys.argv[1] if len(sys.argv) > 1 else "raw")
          out.mkdir(parents=True, exist_ok=True)


          def blank(seconds):
              return [0.0] * int(RATE * seconds)


          def square(phase):
              return 1.0 if (phase % 1.0) < 0.5 else -1.0


          def saw(phase):
              return 2.0 * (phase % 1.0) - 1.0


          def env(i, n, attack=0.01, release=0.03):
              t, d = i / RATE, n / RATE
              a = min(1.0, t / attack) if attack else 1.0
              r = min(1.0, (d - t) / release) if release else 1.0
              return max(0.0, min(a, r))


          def add_tone(buf, start, dur, freq, vol, shape="sine", decay=False, sweep=None):
              s0, n = int(start * RATE), int(dur * RATE)
              phase = 0.0
              for i in range(n):
                  if s0 + i >= len(buf):
                      break
                  f = freq if sweep is None else sweep(i / n)
                  phase += f / RATE
                  v = math.sin(2 * math.pi * phase) if shape == "sine" else square(phase) if shape == "square" else saw(phase)
                  g = math.exp(-6 * i / n) if decay else env(i, n)
                  buf[s0 + i] += v * vol * g


          def siren():
              b = blank(3.6)
              for k in range(3):
                  add_tone(b, k * 1.2, 1.2, 0, .9, "saw", sweep=lambda x: 620 + 880 * (1 - abs(2 * x - 1)))
              return b


          def beeps():
              b = blank(3.0)
              for k in range(3):
                  for i in range(4):
                      add_tone(b, k + i * .14, .09, 2050, .9, "square")
              return b


          def bell():
              b = blank(3.2)
              t, n = 0.0, 0
              while t < 2.7:
                  f = 1240 if n % 2 else 1180
                  for m, v in ((1, .9), (2.76, .45), (5.4, .25)):
                      add_tone(b, t, .5, f * m, v * .6, "sine", decay=True)
                  t += .16
                  n += 1
              return b


          def buzzer():
              b = blank(3.0)
              for k in range(3):
                  add_tone(b, k, .7, 140, .9, "square")
                  add_tone(b, k, .7, 147, .7, "square")
              return b


          def chirps():
              b = blank(3.0)
              for k in range(3):
                  for i in range(3):
                      add_tone(b, k + i * .16, .12, 0, .9, "sine", sweep=lambda x: 2000 * (1.9 ** x))
              return b


          def grabby():
              b = blank(3.2)
              notes = [1047, 1319, 1568, 2093, 1568, 1319, 1568, 2093]
              for k in range(2):
                  for i, f in enumerate(notes):
                      add_tone(b, k * 1.6 + i * .2, .17, f, .7, "square")
              return b


          def save(name, buf):
              peak = max(1e-9, max(abs(x) for x in buf))
              data = array.array("h", (int(max(-1.0, min(1.0, math.tanh(1.4 * x / peak))) * 30000) for x in buf))
              with wave.open(str(out / f"{name}.wav"), "wb") as w:
                  w.setnchannels(1)
                  w.setsampwidth(2)
                  w.setframerate(RATE)
                  w.writeframes(data.tobytes())
              print(f"{name}.wav  {len(buf) / RATE:.1f}s")


          for name, fn in (("siren", siren), ("beeps", beeps), ("bell", bell), ("buzzer", buzzer), ("chirps", chirps), ("grabby", grabby)):
              save(name, fn())
          SB_FILE_5_END

          cat > tools/android.js <<'SB_FILE_6_END'
          // Study Buddy Android app helpers.
          // Lets the app (stored inside the APK) use the phone: notifications, alarms that ring
          // when the app is closed, vibration, the share sheet and saving files to Downloads.
          (function () {
            // Supabase library is bundled in the APK (vendor/supabase.js)
            window.__loadSupabase = function () {
              if (window.supabase && window.supabase.createClient) return Promise.resolve(window.supabase);
              return new Promise(function (ok, bad) {
                var s = document.createElement('script');
                s.src = 'vendor/supabase.js';
                s.onload = function () { ok(window.supabase); };
                s.onerror = function () { bad(new Error('Could not load the app. Please reinstall Study Buddy.')); };
                document.head.appendChild(s);
              });
            };

            var A = window.AndroidApp;
            if (!A) return;

            // Files are already on the phone, so no service worker is needed.
            try {
              if (navigator.serviceWorker) {
                navigator.serviceWorker.register = function () { return Promise.reject(new Error('Not needed in the app')); };
                navigator.serviceWorker.getRegistration = function () { return Promise.resolve(undefined); };
              }
            } catch (e) { }

            // Phone notifications
            function AppNotification(title, opts) {
              try { A.showNotification(String(title || ''), String((opts && opts.body) || '')); } catch (e) { }
            }
            Object.defineProperty(AppNotification, 'permission', {
              get: function () { try { return A.notificationPermission(); } catch (e) { return 'default'; } }
            });
            var waiting = [];
            AppNotification.requestPermission = function (cb) {
              return new Promise(function (res) {
                waiting.push(function (s) { res(s); if (typeof cb === 'function') cb(s); });
                A.requestNotificationPermission();
              });
            };
            window.__notifPermResult = function (s) { var w = waiting; waiting = []; w.forEach(function (f) { f(s); }); };
            try { Object.defineProperty(window, 'Notification', { value: AppNotification, configurable: true, writable: true }); }
            catch (e) { window.Notification = AppNotification; }

            // Vibration and share sheet
            try {
              Object.defineProperty(navigator, 'vibrate', {
                configurable: true,
                value: function (p) { try { A.vibrate(JSON.stringify(p === undefined ? 0 : p)); } catch (e) { } return true; }
              });
            } catch (e) { }
            try {
              Object.defineProperty(navigator, 'share', {
                configurable: true,
                value: function (d) { d = d || {}; A.share(String(d.title || ''), String(d.text || ''), String(d.url || '')); return Promise.resolve(); }
              });
            } catch (e) { }

            // "Download" buttons save into the phone's Downloads folder
            var revoke = URL.revokeObjectURL.bind(URL);
            URL.revokeObjectURL = function (u) { setTimeout(function () { revoke(u); }, 60000); };
            var click = HTMLAnchorElement.prototype.click;
            HTMLAnchorElement.prototype.click = function () {
              var a = this;
              if (a.download && /^(blob|data):/.test(a.href)) {
                fetch(a.href).then(function (r) { return r.blob(); }).then(function (b) {
                  var fr = new FileReader();
                  fr.onload = function () { A.saveFile(a.download, b.type || 'application/octet-stream', String(fr.result).split(',')[1] || ''); };
                  fr.readAsDataURL(b);
                }).catch(function () { });
                return;
              }
              return click.call(a);
            };
          })();
          SB_FILE_6_END

          cat > app/src/main/java/com/grabbyapp/studybuddy/AlarmActivity.java <<'SB_FILE_7_END'
          package com.grabbyapp.studybuddy;

          import android.app.Activity;
          import android.app.KeyguardManager;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import androidx.webkit.WebViewAssetLoader;

          import org.json.JSONObject;

          /**
           * The alarm screen. Shows over the lock screen, turns the screen on,
           * blocks Back and the volume buttons, and only closes after enough
           * correct answers (questions come from the student's own flashcards).
           */
          public class AlarmActivity extends Activity {
              static volatile boolean visible = false;
              private WebView web;
              private boolean answered = false;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  if (Build.VERSION.SDK_INT >= 27) {
                      setShowWhenLocked(true);
                      setTurnScreenOn(true);
                  } else {
                      getWindow().addFlags(WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED | WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON);
                  }
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  getWindow().setStatusBarColor(Color.parseColor("#1E3A8A"));
                  getWindow().setNavigationBarColor(Color.parseColor("#1E3A8A"));

                  // opened from the notification after Android restarted the app: make sure it rings
                  if (!AlarmService.ringing && AlarmStore.sp(this).getBoolean("active", false)) {
                      try { AlarmService.start(this, AlarmStore.sp(this).getLong("cur_time", System.currentTimeMillis()), 0, AlarmStore.sp(this).getBoolean("cur_test", false)); }
                      catch (Exception ignored) { }
                  }
                  if (!AlarmStore.sp(this).getBoolean("active", false) && !AlarmService.ringing) { finish(); return; }

                  WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                          .setDomain(MainActivity.ASSET_HOST)
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();
                  web = new WebView(this);
                  web.setBackgroundColor(Color.parseColor("#1E3A8A"));
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setTextZoom(100);
                  s.setSupportZoom(false);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  web.addJavascriptInterface(new AlarmBridge(), "AlarmBridge");
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) { return loader.shouldInterceptRequest(r.getUrl()); }
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) { return !MainActivity.ASSET_HOST.equals(r.getUrl().getHost()); }
                  });
                  web.loadUrl("https://" + MainActivity.ASSET_HOST + "/assets/www/alarm.html");
              }

              @Override protected void onResume() { super.onResume(); visible = true; }
              @Override protected void onPause() { visible = false; super.onPause(); }

              @Override
              public void onBackPressed() {
                  if (answered) { super.onBackPressed(); return; }
                  Toast.makeText(this, "🔒 Answer correctly to stop the alarm!", Toast.LENGTH_SHORT).show();
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (!answered && (keyCode == KeyEvent.KEYCODE_VOLUME_DOWN || keyCode == KeyEvent.KEYCODE_VOLUME_UP || keyCode == KeyEvent.KEYCODE_VOLUME_MUTE)) {
                      Toast.makeText(this, "🔊 Nice try! Answer to stop me 😈", Toast.LENGTH_SHORT).show();
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }

              private void openApp(String route) {
                  Intent i = new Intent(this, MainActivity.class)
                          .putExtra("route", route == null ? "home" : route)
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  KeyguardManager km = (KeyguardManager) getSystemService(KEYGUARD_SERVICE);
                  if (Build.VERSION.SDK_INT >= 26 && km != null && km.isKeyguardLocked()) {
                      km.requestDismissKeyguard(this, new KeyguardManager.KeyguardDismissCallback() {
                          @Override public void onDismissSucceeded() { startActivity(i); finishAndRemoveTask(); }
                          @Override public void onDismissCancelled() { finishAndRemoveTask(); }
                          @Override public void onDismissError() { startActivity(i); finishAndRemoveTask(); }
                      });
                  } else {
                      startActivity(i);
                      finishAndRemoveTask();
                  }
              }

              /** Called by alarm.html */
              class AlarmBridge {
                  @JavascriptInterface public String getData() { return AlarmStore.screenData(AlarmActivity.this); }

                  @JavascriptInterface public void progress(int correct, int wrong) { /* the screen shows progress itself */ }

                  @JavascriptInterface public void done(String json) {
                      int correct = 0, total = 0;
                      try { JSONObject o = new JSONObject(json); correct = o.optInt("correct"); total = o.optInt("total"); } catch (Exception ignored) { }
                      answered = true;
                      AlarmStore.addResult(AlarmActivity.this, correct, total);
                      AlarmService.stopNow();
                      AlarmScheduler.scheduleAll(AlarmActivity.this);
                  }

                  @JavascriptInterface public void openApp(String route) { runOnUiThread(() -> AlarmActivity.this.openApp(route)); }

                  @JavascriptInterface public void close() { runOnUiThread(() -> { if (answered) finishAndRemoveTask(); }); }
              }
          }
          SB_FILE_7_END

          cat > app/src/main/java/com/grabbyapp/studybuddy/AlarmReceiver.java <<'SB_FILE_8_END'
          package com.grabbyapp.studybuddy;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          /** Android calls this at the alarm time: start ringing (even if the app is closed). */
