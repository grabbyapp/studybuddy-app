              static Uri soundUri(Context c, String sound) {
                  if (sound != null && sound.startsWith("uri:")) return Uri.parse(sound.substring(4));
                  String name = sound == null || sound.isEmpty() ? "siren" : sound;
                  int id = c.getResources().getIdentifier(name, "raw", c.getPackageName());
                  if (id == 0) id = c.getResources().getIdentifier("siren", "raw", c.getPackageName());
                  return Uri.parse("android.resource://" + c.getPackageName() + "/" + id);
              }
