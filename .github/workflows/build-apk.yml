              /** Opens the phone setting that fixes one item of alarmHealth(). */
              @JavascriptInterface
              public void fixAlarm(String which) {
                  a.runOnUiThread(() -> {
                      Uri pkg = Uri.parse("package:" + a.getPackageName());
                      Intent i = null;
                      if ("notifications".equals(which)) {
                          if (Build.VERSION.SDK_INT >= 33 && !Notifier.allowed(a)) { a.requestNotifPermission(); return; }
                          i = new Intent(Settings.ACTION_APP_NOTIFICATION_SETTINGS).putExtra(Settings.EXTRA_APP_PACKAGE, a.getPackageName());
